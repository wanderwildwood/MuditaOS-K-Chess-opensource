name: Release

on:
  push:
    tags:
      - 'v*'
  # Also startable by hand. A tag push can take a long time to produce a run - on 2026-08-26 these
  # took 15 to 25 minutes to appear, long enough to look like the push had done nothing - and this
  # gives a way to start a release without deleting and re-pushing a tag, or to retry one that
  # failed halfway.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'liberica'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 5
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      # Without these the build falls back to the AOSP test key checked into this repo, whose
      # private half ships with AOSP - the release would go out signed with a key anybody has.
      # Fail loudly instead of shipping that.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set - refusing to build an unsigned release."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/signing.keystore
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > signing/signing.properties

      - name: Build APK
        run: ./gradlew :app-android:assembleRelease

      # A release signed with the wrong key cannot be taken back once people have installed it.
      # The forbidden fingerprint is read from the repo's own keystore rather than matched by
      # name, because this one is the AOSP test key (CN=Android), not CN=Android Debug.
      - name: Verify the APK is not signed with the checked-in key
        run: |
          apk=$(find app-android/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          apk_digest=$(echo "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          repo_digest=$(keytool -list -v -keystore app-android/certs/debug.keystore -storepass android \
            | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          if [ -z "$apk_digest" ] || [ -z "$repo_digest" ]; then
            echo "::error::Could not read a signing certificate - refusing to release unchecked."
            exit 1
          fi
          if [ "$apk_digest" = "$repo_digest" ]; then
            echo "::error::APK is signed with the keystore checked into this repo."
            exit 1
          fi

      # Two copies of the same APK go up. The versioned name is what people end up with
      # in their downloads folder and what a checksum quoted anywhere refers to; the
      # unversioned one exists so that
      #   .../releases/latest/download/chessplus.apk
      # is a link that keeps working after the next release, which a versioned link does
      # not. Both are byte-identical - only the file name differs.
      - name: Rename APK and generate checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%-chessplus}"
          apk_name="chessplus-${version}.apk"
          apk_path=$(find app-android/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          cp "$apk_path" "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          cp "$apk_path" chessplus.apk
          sha256sum chessplus.apk > chessplus.apk.sha256

      # The generated notes are a list of commits; they cannot say what someone has to do
      # before installing. This goes above them, and can be emptied once nobody is still
      # upgrading from a build signed with the AOSP test key.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # The wildcard does not match the unversioned pair, so it is listed too.
          files: |
            chessplus-*.apk
            chessplus-*.apk.sha256
            chessplus.apk
            chessplus.apk.sha256
          body_path: .github/release-body.md
          generate_release_notes: true
