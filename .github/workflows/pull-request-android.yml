name: Pull Request - Android

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  test:
    name: Test - Android
    if: github.event.pull_request.draft == false
    runs-on: [ Linux ]
    env:
      working-directory: app-android
      ANDROID_HOME: /usr/local/Caskroom/android-sdk
      MUDITA_ARTIFACTORY_PASSWORD: ${{secrets.MUDITA_ARTIFACTORY_PASSWORD}}
      MUDITA_ARTIFACTORY_USERNAME: ${{secrets.MUDITA_ARTIFACTORY_USERNAME}}
      MUDITA_PRIVATE_REPOSITORY_URL: ${{secrets.MUDITA_PRIVATE_REPOSITORY_URL}}
      SENTRY_DSN: ${{secrets.SENTRY_DSN}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'liberica'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 5
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: KtLint check
        timeout-minutes: 5
        run: ./gradlew ktlint

      - name: Detekt check
        timeout-minutes: 5
        run: ./gradlew detekt

      - name: Android lint check
        timeout-minutes: 15
        run: ./gradlew :app:lintDebug

      - name: Unit tests with coverage
        timeout-minutes: 15
        run: ./gradlew koverXmlReportMain

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.xml'

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint-report.xml'

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt-report.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test*UnitTest/**.xml'

      - name: Add coverage to PR
        id: kover
        uses: mi-kas/kover-report@v1
        with:
          path: |
            ${{ github.workspace }}/build/reports/kover/reportMain.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          coverage-counter-type: LINE
          title: Code Coverage
          update-comment: true
